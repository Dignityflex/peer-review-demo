{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-10">
  <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
    <h2 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Reset Password</h2>
    <p class="text-xs text-slate-500 mb-6">Enter the email associated with your account, and we will send you a reset link.</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
        <input type="email" name="email" required autofocus
               class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 transition">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2.5 rounded-lg shadow-sm transition">
        Send Reset Link
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="{% url 'login' %}" class="text-xs font-semibold text-slate-500 hover:text-indigo-600">&larr; Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
