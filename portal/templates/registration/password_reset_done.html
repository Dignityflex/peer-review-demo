{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-10">
  <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm text-center">
    <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 font-bold text-lg flex items-center justify-center mx-auto mb-3">✓</div>
    <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Check Your Inbox</h2>
    <p class="text-xs text-slate-600 mt-2 leading-relaxed">
      If an account exists with that email, we have sent instructions to reset your password.
    </p>
    <div class="mt-6">
      <a href="{% url 'login' %}" class="text-xs font-semibold text-indigo-600 hover:underline">Return to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
