{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-10">
  <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
    <div class="text-center mb-6">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white font-extrabold text-lg flex items-center justify-center mx-auto mb-3 shadow-sm shadow-indigo-200">
        A
      </div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Sign In</h2>
      <p class="text-xs text-slate-500 mt-1">Access your peer reviews and paper submissions</p>
    </div>

    {% if form.errors %}
      <div class="mb-5 p-3 rounded-lg bg-rose-50 border border-rose-200 text-xs text-rose-700 font-medium">
        Invalid username or password. Please try again.
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Username</label>
        <input type="text" name="username" autofocus required 
               class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 transition">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600">Password</label>
          <a href="{% url 'password_reset' %}" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition">Forgot password?</a>
        </div>
        <input type="password" name="password" required 
               class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 transition">
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2.5 rounded-lg shadow-sm shadow-indigo-100 transition">
        Log In
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-500">
        Don't have an account? 
        <a href="{% url 'signup' %}" class="font-bold text-indigo-600 hover:text-indigo-800 transition">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
