{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-10">
  <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm text-center">
    <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 font-bold text-lg flex items-center justify-center mx-auto mb-3">✓</div>
    <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Password Reset Complete</h2>
    <p class="text-xs text-slate-600 mt-2">Your password has been successfully updated.</p>
    <div class="mt-6">
      <a href="{% url 'login' %}" class="inline-block bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-lg shadow-sm hover:bg-indigo-700 transition">
        Sign in with new password
      </a>
    </div>
  </div>
</div>
{% endblock %}
