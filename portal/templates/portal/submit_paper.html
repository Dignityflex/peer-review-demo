{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 border border-gray-200 rounded-lg shadow-sm">
  <h2 class="text-2xl font-bold text-gray-900 mb-1">Submit a Research Proposal</h2>
  <p class="text-sm text-gray-500 mb-6">Fill in details for peer review distribution.</p>
  
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Paper Title</label>
      <input type="text" name="title" placeholder="e.g. Distributed Consensus in Edge Networks" required class="w-full border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Category / Domain</label>
      <input type="text" name="category" placeholder="e.g. Systems, AI, Cryptography" required class="w-full border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">External Link (Optional)</label>
      <input type="url" name="pdf_url" placeholder="https://arxiv.org/... or Drive link" class="w-full border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Abstract</label>
      <textarea name="abstract" rows="5" placeholder="Summarize your methodology and key findings..." required class="w-full border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
    </div>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-md font-medium text-sm transition">Publish Paper</button>
  </form>
</div>
{% endblock %}
